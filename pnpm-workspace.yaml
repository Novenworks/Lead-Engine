packages:
  - apps/*
  - packages/*

# Supply-chain defense: refuse npm versions published less than 24h ago.
# Malicious releases are usually caught and pulled within hours.
minimumReleaseAge: 1440

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
